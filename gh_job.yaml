apiVersion: batch/v1
kind: Job
metadata:
  name: greenhouse-batch-2
spec:
  completions: 576 # Adjust to total number of targets
  parallelism: 40 # Adjust based on available resources
  completionMode: Indexed
  backoffLimit: 10
  podFailurePolicy:
    rules:
    - action: Ignore
      onExitCodes:
        operator: NotIn
        values: [0]
  # podFailurePolicy:
  #   rules:
  #   - action: Ignore
  #     onExitCodes:
  #       operator: In
  #       values: [42]
  #   - action: Ignore
  #     onExitCodes:
  #       operator: NotIn
  #       values: [0]
  #   - action: Ignore
  #     onPodConditions:
  #     - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 37000
      containers:
      - name: gh-single-worker
        image: greenhouse_llm_all:v1
        imagePullPolicy: Never
        securityContext:
          privileged: true
        resources:
          limits:
            memory: "8Gi"
            cpu: "2"
          requests:
            memory: "2Gi"
            cpu: "1"
        command:
        - 'bash'
        - '-c'
        - '/gh/entrypoint.sh /shared /shared/web_true_result.list ${JOB_COMPLETION_INDEX}'
        volumeMounts:
        - name: fakedev
          mountPath: "/host/dev"
        env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
      volumes:
        - name: fakedev
          hostPath:
            path: /dev
